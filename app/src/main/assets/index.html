<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
:root { --bg:#0e1116; --card:#171c26; --line:#252c3b; --txt:#e8ebf3; --mut:#8a93a8; --acc:#7c5cff; --ok:#22d3a6; --bad:#ff5d6c; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--txt); font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
header { padding:18px 20px 8px; display:flex; align-items:center; justify-content:space-between; }
header h1 { margin:0; font-size:22px; letter-spacing:.5px; }
header h1 span { color:var(--acc); }
.pill { font-size:12px; padding:5px 12px; border-radius:20px; background:var(--card); color:var(--mut); border:1px solid var(--line); }
.pill.on { color:var(--ok); border-color:var(--ok); }
main { flex:1; overflow-y:auto; padding:8px 20px 20px; }
.tab { display:none; } .tab.show { display:block; }

.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; position:relative; }
.label { position:absolute; top:-9px; left:14px; background:var(--bg); border:1px solid var(--line); color:var(--acc); font-size:11px; font-weight:bold; padding:2px 10px; border-radius:10px; letter-spacing:1px; }
.card .t { font-size:17px; font-weight:bold; margin-top:4px; }
.card .s { font-size:13px; color:var(--mut); margin-top:4px; word-break:break-all; }

.power { display:flex; flex-direction:column; align-items:center; margin:26px 0 22px; }
#btn { width:150px; height:150px; border-radius:50%; border:3px solid var(--acc); background:transparent; color:var(--acc); font-size:18px; font-weight:bold; letter-spacing:1px; transition:all .35s; box-shadow:0 0 30px rgba(124,92,255,.35); }
#btn.on { border-color:var(--ok); color:var(--ok); box-shadow:0 0 45px rgba(34,211,166,.5); animation:p 2s infinite; }
@keyframes p { 50% { box-shadow:0 0 70px rgba(34,211,166,.8); } }
#tempo { margin-top:14px; color:var(--mut); font-size:20px; font-variant-numeric:tabular-nums; }

.row { display:flex; align-items:center; justify-content:space-between; }
.add { background:var(--acc); border:none; color:#fff; padding:9px 16px; border-radius:20px; font-size:14px; }
.item { cursor:pointer; }
.item.sel { border-color:var(--acc); background:#1d1b34; }
.tag { font-size:11px; padding:2px 8px; border-radius:8px; background:var(--acc); margin-left:8px; }
.del { background:none; border:none; color:var(--bad); font-size:20px; padding:4px 8px; }
.vazio { text-align:center; color:var(--mut); padding:28px 0; }

.logbox { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; min-height:300px; font-family:monospace; font-size:13px; line-height:1.6; }
.logbox .h { color:var(--acc); }
.tools { display:flex; gap:8px; }
.tools button { background:var(--card); border:1px solid var(--line); color:var(--txt); padding:8px 14px; border-radius:12px; font-size:13px; }

nav { display:flex; background:var(--card); border-top:1px solid var(--line); }
nav button { flex:1; background:none; border:none; color:var(--mut); padding:12px 0 14px; font-size:12px; }
nav button b { display:block; font-size:20px; margin-bottom:2px; }
nav button.act { color:var(--acc); }

#modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); align-items:flex-end; z-index:10; }
#modal.show { display:flex; }
.sheet { width:100%; max-height:90vh; overflow-y:auto; background:#131824; border-radius:24px 24px 0 0; padding:22px 20px 26px; }
.sheet h3 { margin:0 0 14px; }
.sheet input, .sheet select { width:100%; margin-bottom:10px; padding:13px 14px; font-size:15px; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:12px; }
.btns { display:flex; gap:10px; margin-top:6px; }
.btns button { flex:1; padding:13px; font-size:15px; border:none; border-radius:12px; color:#fff; }
.c { background:var(--line); } .s2 { background:var(--acc); font-weight:bold; }
#toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#2b3350; padding:10px 18px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; z-index:20; pointer-events:none; }
#toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <h1>Minha<span>VPN</span></h1>
  <div class="pill" id="pill">Desconectado</div>
</header>

<main>
  <!-- INÍCIO -->
  <section class="tab show" id="t-inicio">
    <div class="power">
      <button id="btn">LIGAR</button>
      <div id="tempo">00:00:00</div>
    </div>
    <div class="card"><span class="label">SERVIDOR</span>
      <div class="t" id="hNome">Nenhum selecionado</div>
      <div class="s" id="hInfo">Vá em Servidores e adicione um</div>
    </div>
    <div class="card"><span class="label">MODO</span>
      <div class="t" id="hModo">—</div>
      <div class="s" id="hSni">—</div>
    </div>
  </section>

  <!-- SERVIDORES -->
  <section class="tab" id="t-serv">
    <div class="row" style="margin:8px 0 14px">
      <h2 style="margin:0;font-size:18px">Servidores</h2>
      <button class="add" id="btnAdd">+ Adicionar</button>
    </div>
    <div id="lista"></div>
  </section>

  <!-- REGISTROS -->
  <section class="tab" id="t-log">
    <div class="row" style="margin:8px 0 14px">
      <h2 style="margin:0;font-size:18px">Registros</h2>
      <div class="tools"><button id="btnCopy">Copiar</button><button id="btnClear">Limpar</button></div>
    </div>
    <div class="logbox" id="logbox"></div>
  </section>
</main>

<nav>
  <button class="act" data-tab="inicio"><b>⌂</b>Início</button>
  <button data-tab="serv"><b>☰</b>Servidores</button>
  <button data-tab="log"><b>▤</b>Registros</button>
</nav>

<div id="modal">
  <div class="sheet">
    <h3>Adicionar servidor</h3>
    <input id="fNome" placeholder="Nome">
    <select id="fProto">
      <option>SSH</option><option>VLESS</option><option>VMess</option>
      <option>Trojan</option><option>WireGuard</option>
    </select>
    <input id="fEnd" placeholder="Endereço (IP ou domínio)">
    <input id="fPorta" type="number" placeholder="Porta (ex: 22 ou 443)">
    <div id="boxSsh">
      <input id="fUser" placeholder="Usuário SSH" autocapitalize="none">
      <input id="fPass" type="password" placeholder="Senha SSH">
      <select id="fModo">
        <option>SSH direto</option>
        <option>SSH + TLS (SNI)</option>
      </select>
    </div>
    <input id="fSni" placeholder="SNI (ex: exemplo.com)" autocapitalize="none">
    <div class="btns">
      <button class="c" id="btnCancel">Cancelar</button>
      <button class="s2" id="btnSave">Salvar</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const A = window.Android || {
  carregar: () => localStorage.getItem("lista") || "[]",
  salvar: (j) => localStorage.setItem("lista", j),
  ligar: () => onVpnState(true),
  desligar: () => onVpnState(false)
};
const $ = (id) => document.getElementById(id);
let servidores = [], sel = 0, ligado = false, inicio = 0, timer = null, logs = [];

function toast(m) { const t = $("toast"); t.textContent = m; t.className = "show"; setTimeout(() => t.className = "", 2200); }
function hora() { return new Date().toTimeString().slice(0, 8); }
function log(m) { logs.push("[" + hora() + "] " + m); desenharLog(); }
function desenharLog() {
  const b = $("logbox"); b.innerHTML = "";
  if (!logs.length) { b.textContent = "Sem registros."; return; }
  logs.forEach((l) => {
    const d = document.createElement("div");
    const i = l.indexOf("]") + 1;
    const h = document.createElement("span"); h.className = "h"; h.textContent = l.slice(0, i);
    d.appendChild(h); d.appendChild(document.createTextNode(l.slice(i)));
    b.appendChild(d);
  });
}

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.className = "");
  b.className = "act";
  document.querySelectorAll(".tab").forEach((t) => t.className = "tab");
  $("t-" + b.dataset.tab).className = "tab show";
});

function carregar() {
  try { servidores = JSON.parse(A.carregar()); } catch (e) { servidores = []; }
  if (sel >= servidores.length) sel = 0;
  desenhar();
}
function salvar() { A.salvar(JSON.stringify(servidores)); }

function desenhar() {
  const box = $("lista"); box.innerHTML = "";
  if (!servidores.length) box.innerHTML = '<div class="vazio">Nenhum servidor adicionado</div>';
  servidores.forEach((s, i) => {
    const c = document.createElement("div");
    c.className = "card item" + (i === sel ? " sel" : "");
    const r = document.createElement("div"); r.className = "row";
    const e = document.createElement("div");
    const n = document.createElement("div"); n.className = "t"; n.textContent = s.nome;
    const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = s.protocolo; n.appendChild(tg);
    const inf = document.createElement("div"); inf.className = "s";
    inf.textContent = s.endereco + ":" + s.porta + (s.sni ? "  •  SNI " + s.sni : "");
    e.appendChild(n); e.appendChild(inf);
    const d = document.createElement("button"); d.className = "del"; d.textContent = "✕";
    d.onclick = (ev) => {
      ev.stopPropagation();
      if (ligado) { toast("Desligue a VPN antes"); return; }
      servidores.splice(i, 1); if (sel >= servidores.length) sel = 0;
      salvar(); desenhar(); resumo();
    };
    c.onclick = () => { if (!ligado) { sel = i; desenhar(); resumo(); } };
    r.appendChild(e); r.appendChild(d); c.appendChild(r); box.appendChild(c);
  });
  resumo();
}

function resumo() {
  const s = servidores[sel];
  if (!s) { $("hNome").textContent = "Nenhum selecionado"; $("hInfo").textContent = "Vá em Servidores e adicione um"; $("hModo").textContent = "—"; $("hSni").textContent = "—"; return; }
  $("hNome").textContent = s.nome;
  $("hInfo").textContent = s.endereco + ":" + s.porta;
  $("hModo").textContent = s.protocolo + (s.modo ? " → " + s.modo : "");
  $("hSni").textContent = s.sni ? "SNI: " + s.sni : "Sem SNI";
}

function fmt(n) { const p = (x) => String(x).padStart(2, "0"); return p(Math.floor(n / 3600)) + ":" + p(Math.floor(n % 3600 / 60)) + ":" + p(n % 60); }

function onVpnState(e) {
  ligado = e;
  $("btn").className = e ? "on" : ""; $("btn").textContent = e ? "DESLIGAR" : "LIGAR";
  $("pill").textContent = e ? "Conectado" : "Desconectado"; $("pill").className = "pill" + (e ? " on" : "");
  clearInterval(timer);
  if (e) { inicio = Date.now(); timer = setInterval(() => $("tempo").textContent = fmt(Math.floor((Date.now() - inicio) / 1000)), 1000); log("Túnel VPN ativo"); }
  else { $("tempo").textContent = "00:00:00"; log("Desconectado"); }
}

$("btn").onclick = () => {
  if (ligado) { A.desligar(); return; }
  if (!servidores.length) { toast("Adicione um servidor primeiro"); return; }
  const s = servidores[sel];
  log("Servidor: " + s.nome + " (" + s.protocolo + ")");
  log("Iniciando conexão...");
  A.ligar(JSON.stringify(s));
};

function ajustaForm() {
  const ssh = $("fProto").value === "SSH";
  $("boxSsh").style.display = ssh ? "block" : "none";
}
$("fProto").onchange = ajustaForm;

$("btnAdd").onclick = () => {
  if (ligado) { toast("Desligue a VPN antes"); return; }
  ["fNome", "fEnd", "fPorta", "fSni", "fUser", "fPass"].forEach((id) => $(id).value = "");
  ajustaForm(); $("modal").className = "show";
};
$("btnCancel").onclick = () => $("modal").className = "";
$("btnSave").onclick = () => {
  const nome = $("fNome").value.trim(), end = $("fEnd").value.trim(), porta = parseInt($("fPorta").value, 10);
  const proto = $("fProto").value;
  if (!nome || !end || isNaN(porta)) { toast("Preencha nome, endereço e porta"); return; }
  if (proto === "SSH" && (!$("fUser").value.trim() || !$("fPass").value)) { toast("Preencha usuário e senha"); return; }
  const s = { nome: nome, endereco: end, porta: porta, sni: $("fSni").value.trim(), protocolo: proto };
  if (proto === "SSH") { s.usuario = $("fUser").value.trim(); s.senha = $("fPass").value; s.modo = $("fModo").value; }
  servidores.push(s); sel = servidores.length - 1;
  salvar(); desenhar(); $("modal").className = ""; toast("Servidor salvo");
};

$("btnClear").onclick = () => { logs = []; desenharLog(); };
$("btnCopy").onclick = () => {
  const t = document.createElement("textarea"); t.value = logs.join("\n"); document.body.appendChild(t);
  t.select(); document.execCommand("copy"); document.body.removeChild(t); toast("Registros copiados");
};

log("App iniciado");
carregar(); ajustaForm();
if (window.Android && A.estaLigado && A.estaLigado()) onVpnState(true);
</script>
</body>
</html>
