 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh; color: #fff;
  font-family: sans-serif;
  background: radial-gradient(circle at 50% 0%, #1b2a4a 0%, #0b0f1a 60%);
  padding: 24px 20px 40px;
}
h1 { margin: 8px 0 0; font-size: 26px; text-align: center; letter-spacing: 1px; }
#status { text-align: center; color: #8b93a7; margin: 6px 0 0; font-size: 15px; }
#status.on { color: #3ddc84; }

.power-wrap { display: flex; flex-direction: column; align-items: center; margin: 36px 0 28px; }
#btn {
  width: 170px; height: 170px; border-radius: 50%; border: none;
  color: #fff; font-size: 20px; font-weight: bold; letter-spacing: 1px;
  background: linear-gradient(145deg, #ff5a5f, #c62828);
  box-shadow: 0 0 40px rgba(255, 70, 70, .45);
  transition: all .4s;
}
#btn.on {
  background: linear-gradient(145deg, #3ddc84, #1b8f4e);
  box-shadow: 0 0 50px rgba(61, 220, 132, .6);
  animation: pulse 2s infinite;
}
@keyframes pulse { 50% { box-shadow: 0 0 80px rgba(61, 220, 132, .85); } }
#tempo { margin-top: 18px; font-size: 22px; color: #8b93a7; font-variant-numeric: tabular-nums; }

.topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.topo h2 { font-size: 16px; margin: 0; color: #c5cbe0; }
.add {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 14px;
}
.card {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
}
.card.sel { border-color: #4d8dff; background: rgba(77,141,255,.14); }
.card .nome { font-weight: bold; font-size: 16px; }
.card .info { color: #8b93a7; font-size: 12px; margin-top: 4px; word-break: break-all; }
.tag {
  display: inline-block; font-size: 11px; padding: 2px 8px; margin-left: 8px;
  border-radius: 10px; background: #4d8dff; vertical-align: middle;
}
.del { background: none; border: none; color: #ff6b6b; font-size: 22px; padding: 4px 10px; }
.vazio { text-align: center; color: #6b7388; padding: 24px 0; }

#modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
  align-items: flex-end; z-index: 10;
}
#modal.show { display: flex; }
.sheet {
  width: 100%; background: #151b2c; border-radius: 24px 24px 0 0;
  padding: 22px 20px 28px;
}
.sheet h3 { margin: 0 0 14px; }
.sheet input, .sheet select {
  width: 100%; margin-bottom: 10px; padding: 13px 14px; font-size: 15px;
  background: #0b0f1a; color: #fff; border: 1px solid #2a3350; border-radius: 12px;
}
.linha { display: flex; gap: 10px; margin-top: 6px; }
.linha button { flex: 1; padding: 13px; font-size: 15px; border: none; border-radius: 12px; color: #fff; }
.cancel { background: #2a3350; }
.save { background: #4d8dff; font-weight: bold; }
</style>
</head>
<body>

<h1>Minha VPN</h1>
<p id="status">Desconectado</p>

<div class="power-wrap">
  <button id="btn">LIGAR</button>
  <div id="tempo">00:00:00</div>
</div>

<div class="topo">
  <h2>Servidores</h2>
  <button class="add" id="btnAdd">+ Servidor</button>
</div>
<div id="lista"></div>

<div id="modal">
  <div class="sheet">
    <h3>Adicionar servidor</h3>
    <input id="fNome" placeholder="Nome do servidor">
    <input id="fEnd" placeholder="Endereço (IP ou domínio)">
    <input id="fPorta" type="number" placeholder="Porta (ex: 443)">
    <input id="fSni" placeholder="SNI (ex: exemplo.com)">
    <select id="fProto">
      <option>VLESS</option><option>VMess</option>
      <option>Trojan</option><option>WireGuard</option>
    </select>
    <div class="linha">
      <button class="cancel" id="btnCancel">Cancelar</button>
      <button class="save" id="btnSave">Salvar</button>
    </div>
  </div>
</div>

<script>
// Ponte com o Kotlin (se abrir só no navegador, usa uma versão de teste)
const A = window.Android || {
  carregar: () => localStorage.getItem("lista") || "[]",
  salvar: (j) => localStorage.setItem("lista", j),
  ligar: () => onVpnState(true),
  desligar: () => onVpnState(false)
};

let servidores = [];
let sel = 0;
let ligado = false;
let inicio = 0;
let timer = null;

const $ = (id) => document.getElementById(id);

function carregar() {
  try { servidores = JSON.parse(A.carregar()); } catch (e) { servidores = []; }
  if (sel >= servidores.length) sel = 0;
  desenhar();
}

function salvar() { A.salvar(JSON.stringify(servidores)); }

function desenhar() {
  const box = $("lista");
  box.innerHTML = "";
  if (servidores.length === 0) {
    box.innerHTML = '<div class="vazio">Nenhum servidor adicionado</div>';
    return;
  }
  servidores.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "card" + (i === sel ? " sel" : "");

    const esq = document.createElement("div");
    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = s.nome;
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = s.protocolo;
    nome.appendChild(tag);
    const info = document.createElement("div");
    info.className = "info";
    info.textContent = s.endereco + ":" + s.porta + (s.sni ? "  •  SNI " + s.sni : "");
    esq.appendChild(nome);
    esq.appendChild(info);

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = (ev) => {
      ev.stopPropagation();
      if (ligado) return;
      servidores.splice(i, 1);
      if (sel >= servidores.length) sel = 0;
      salvar();
      desenhar();
    };

    card.onclick = () => { if (!ligado) { sel = i; desenhar(); } };
    card.appendChild(esq);
    card.appendChild(del);
    box.appendChild(card);
  });
}

function fmt(seg) {
  const p = (n) => String(n).padStart(2, "0");
  return p(Math.floor(seg / 3600)) + ":" + p(Math.floor((seg % 3600) / 60)) + ":" + p(seg % 60);
}

// O Kotlin chama esta função quando a VPN liga ou desliga
function onVpnState(estado) {
  ligado = estado;
  $("btn").className = estado ? "on" : "";
  $("btn").textContent = estado ? "DESLIGAR" : "LIGAR";
  $("status").textContent = estado ? "Conectado" : "Desconectado";
  $("status").className = estado ? "on" : "";
  clearInterval(timer);
  if (estado) {
    inicio = Date.now();
    timer = setInterval(() => {
      $("tempo").textContent = fmt(Math.floor((Date.now() - inicio) / 1000));
    }, 1000);
  } else {
    $("tempo").textContent = "00:00:00";
  }
}

$("btn").onclick = () => {
  if (ligado) { A.desligar(); return; }
  if (servidores.length === 0) { alert("Adicione um servidor primeiro"); return; }
  A.ligar(JSON.stringify(servidores[sel]));
};

$("btnAdd").onclick = () => {
  if (ligado) return;
  ["fNome", "fEnd", "fPorta", "fSni"].forEach((id) => $(id).value = "");
  $("modal").className = "show";
};
$("btnCancel").onclick = () => { $("modal").className = ""; };

$("btnSave").onclick = () => {
  const nome = $("fNome").value.trim();
  const end = $("fEnd").value.trim();
  const porta = parseInt($("fPorta").value, 10);
  if (!nome || !end || isNaN(porta)) { alert("Preencha nome, endereço e porta"); return; }
  servidores.push({
    nome: nome, endereco: end, porta: porta,
    sni: $("fSni").value.trim(), protocolo: $("fProto").value
  });
  sel = servidores.length - 1;
  salvar();
  desenhar();
  $("modal").className = "";
};

carregar();
if (window.Android && A.estaLigado && A.estaLigado()) onVpnState(true);
</script>
</body>
  </html>
