name: Libbox API
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Baixar libbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh run list -R ${{ github.repository }} --workflow libbox.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Run $ID"
          gh run download $ID -R ${{ github.repository }} -n libbox -D aar
          ls -la aar
      - name: Extrair API
        run: |
          cd aar
          AAR=$(ls libbox*.aar | head -n1)
          unzip -o -q "$AAR" classes.jar
          unzip -Z1 classes.jar | grep libbox/ > ../classes.txt
          CL=$(grep -e PlatformInterface -e TunOptions -e libbox/Libbox -e BoxService -e SetupOptions -e CommandServer -e InterfaceUpdateListener -e NetworkInterface -e StringIterator -e RoutePrefix -e ConnectionOwner ../classes.txt | sed 's/.class$//' | tr / .)
          javap -p -cp classes.jar $CL > ../api.txt
          cat ../api.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-api
          path: |
            api.txt
            classes.txt
